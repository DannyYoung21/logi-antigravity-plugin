description: |
  Unofficial plugin that controls Antigravity and Antigravity IDE agents from the Logitech MX Creative Keypad (macOS and Windows):
  up to 16 live session slots, Allow Once / Allow in Conversation / Deny, Stop and Resume, next waiting session,
  new conversation, token and context window usage, and 5h/7d limits for Gemini, Gemini 4 and third-party models (Claude, GPT).
  This is an unofficial community plugin, not affiliated with or endorsed by Google. All data stays on your computer.
  Support: dannylabs.studio@gmail.com
icon256x256: Icon256x256.png
backgroundColor: 4280234834
foregroundColor: 4294967295
textColor: 4294967295
